name: rag

services:
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data


  chroma:
    image: chromadb/chroma:latest
    container_name: rag-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v2/heartbeat"]
      interval: 10s
      retries: 5

volumes:
  redis-data:
  chroma-data:

# docker --version
# docker compose version
# docker compose up -d
# docker compose ps

CHROMA_HOST=localhost
CHROMA_PORT=8001
REDIS_URL=redis://localhost:6379/0